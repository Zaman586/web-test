name: CI/CD Pipeline

on:
  push:
    branches:
      - devops-branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: docker build -t ecomm-app .

    - name: Run Container for Testing
      run: docker run -d -p 3000:3000 --name test-container ecomm-app

    - name: Validate App Is Running
      run: curl --retry 5 --retry-delay 5 http://localhost:3000 || exit 1
