name: CI/CD Pipeline

on:
  push:
    branches:
      - devops-branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: docker build -t ecomm-app .

    - name: Run Docker Container
      run: docker run -d -p 8080:3000 --name ecomm-app-container ecomm-app

    - name: Wait for App to Start
      run: |
        echo "Waiting for the app to be ready..."
        until curl --retry 10 --retry-delay 6 http://localhost:8080; do
          echo "Waiting for app to start..."
          sleep 5
        done

    - name: Print Container Logs (for debugging)
      run: docker logs ecomm-app-container || true

    - name: Validate App Is Running
      run: curl --retry 10 --retry-delay 6 http://localhost:8080 || exit 1

    - name: Clean Up Docker Container
      if: always()
      run: |
        echo "Cleaning up Docker container..."
        docker rm -f ecomm-app-container || true
